name: ci

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The AI-context record layers, checked WITHOUT an install: all three scripts
  # are pure Node with no dependencies, so this job costs seconds and gives the
  # fastest possible signal on the one class of problem nothing else catches —
  # a duplicate or dangling ADR/lesson number, which is an identity collision
  # that later gets "fixed" by renumbering and silently repoints every reference
  # written under the old scheme. Blocking. `ai:lint` + `ai:doc-staleness` are
  # report-only here, same as in the pre-commit hook.
  ai-records:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Record-id identity (ADRs + lessons, incl. @adr backrefs)
        run: node scripts/checkRecordIds.mjs --backrefs

      - name: AGENTS.md invariants (report-only)
        run: node scripts/lintInvariants.mjs || true

      - name: Hand-written doc staleness (report-only)
        run: node scripts/checkDocStaleness.mjs || true

  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate type artifacts
        run: npm run generateArtifacts

      - name: Verify artifacts exist
        run: |
          test -s src/_sockets/apiTypes.generated.ts
          test -s src/docs/apiDocs.generated.json
          ls server/prod/generatedApis.*.ts

      # `verify` builds the packages first (eslint.luckystack.config.js imports
      # @luckystack/core/eslint from core's dist, so lint needs it), then runs
      # lint, typecheck, client build, server bundle and the unit tests at the
      # same time inside one thread budget (scripts/runParallel.mjs). Each
      # command's log is printed as one labelled block when it finishes.
      #
      # Unit tests, not `npm run test`: that live-server sweep hits a running
      # dev server, which CI does not have. The sweep stays a local/dev gate.
      - name: Verify (lint, typecheck, build, unit tests in parallel)
        run: npm run verify

  # The ONLY gate that exercises the real consumer path: publish every package
  # to a throwaway registry, scaffold against it, install with a real package
  # manager, then typecheck + build the result. Unit tests cannot reach this —
  # they never resolve an `@luckystack/*` tarball by semver from a registry.
  #
  # Deliberately NOT `continue-on-error`. It went unwired for months, and in
  # that time it accumulated two defects of its own (a work root Vite could not
  # load a config from, and an aborted run that still printed ALL GREEN). An
  # advisory gate is what let that happen.
  #
  # Single Node version on purpose: this is an install/packaging check, not a
  # runtime-matrix check, and it publishes 17 packages per run.
  e2e-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      # The harness builds + publishes the packages itself as its first steps,
      # so no separate build:packages is needed here.
      - name: Scaffold e2e (verdaccio, real install)
        run: node scripts/e2eVerdaccio.mjs
        env:
          # Keep the work root off the runner's shared temp for the same reason
          # it moved locally: Vite resolves `vite.config.ts` by walking UP from
          # the project, and a crowded temp root makes that walk fail — silently
          # falling back to a plugin-less config and breaking the build.
          LUCKYSTACK_E2E_WORK_DIR: ${{ runner.temp }}/luckystack-e2e
